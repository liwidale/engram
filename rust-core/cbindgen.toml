language = "C"
include_guard = "ENGRAM_CORE_H"
autogen_warning = "/* Generated by cbindgen from rust-core/crates/engram-core. Do not edit. */"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stdint.h", "stddef.h"]
no_includes = true

[export]
prefix = ""
include = ["EngramHandle"]

[parse]
parse_deps = false
