[package]
name = "engram-desktop"
description = "Engram desktop app for Windows and Linux: project memory, architecture, decisions and agent context."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
engram-core = { path = "../engram-core" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence", "system_fonts", "wayland", "x11"] }
rfd = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
