[workspace]
resolver = "2"
members = ["crates/engram-core", "crates/engram-mcp", "crates/engram-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Liwidale"]
repository = "https://github.com/liwidale/engram"
homepage = "https://github.com/liwidale/engram"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
